server {
    listen 80;
    server_name localhost;

    # Répertoire racine où sont stockés les fichiers statiques compilés
    root /usr/share/nginx/html;
    index index.html;

    # Support pour le routage Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimisation de la mise en cache des assets statiques (CSS, JS, images, polices)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
