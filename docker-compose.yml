# Les ${VARIABLE:-défaut} sont remplacées par les valeurs du fichier .env (voir .env.example).
# Pipeline au démarrage :  lint ──► test ──► backend ──► proxy
services:
  # CI 1 - Lint du code backend (s'exécute une fois puis s'arrête)
  lint:
    build:
      context: ./ci
      dockerfile: Dockerfile.lint
    container_name: cordialement-lint
    volumes:
      # Code monté en lecture seule : le job de CI ne peut pas modifier ce qu'il vérifie
      - ./back:/workspace:ro
    # Aucun accès réseau : le lint n'a besoin de rien télécharger
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: ${LINT_CPUS:-0.50}
          memory: ${LINT_MEMORY:-256M}

  # CI 2 - Tests du backend, construits depuis l'étape "test" du Dockerfile backend
  test:
    build:
      context: ./back
      target: test
    container_name: cordialement-test
    # Aucun accès réseau : garantit que les tests n'appellent jamais la vraie API IA
    network_mode: none
    restart: "no"
    depends_on:
      lint:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: ${TEST_CPUS:-0.50}
          memory: ${TEST_MEMORY:-256M}

  # Microservice Backend - API Node.js
  backend:
    build:
      context: ./back
      target: production
    container_name: cordialement-backend

    # Injecte le processus "tini" (PID 1) pour intercepter le signal d'arrêt (SIGTERM).
    # Permet à Node.js de fermer ses requêtes proprement au lieu d'être "tué" brutalement.
    init: true
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Secrets et réglages IA fournis au runtime uniquement (jamais inscrits dans l'image)
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-qwen/qwen3.8-27b}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-8000}
    expose:
      # Ouvre le port spécifiquement sur le réseau privé Docker.
      - "3000"
    depends_on:
      # Seul un code qui passe le lint et les tests est démarré
      test:
        condition: service_completed_successfully
    healthcheck:
      # Lance un appel régulier (wget) pour vérifier si l'API est vivante.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPUS:-0.50}
          memory: ${BACKEND_MEMORY:-128M}
    networks:
      - cordialement-network

  # Microservice Frontend - Vue 3 compilé servi par Nginx
  frontend:
    build: ./front
    container_name: cordialement-frontend
    init: true
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPUS:-0.20}
          memory: ${FRONTEND_MEMORY:-64M}
    networks:
      - cordialement-network

  # Reverse Proxy Nginx - Point d'entrée sécurisé
  proxy:
    build: ./proxy
    container_name: cordialement-proxy
    init: true
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${PROXY_CPUS:-0.20}
          memory: ${PROXY_MEMORY:-64M}
    networks:
      - cordialement-network

networks:
  # Réseau privé Docker de type bridge isolant les conteneurs
  cordialement-network:
    driver: bridge
